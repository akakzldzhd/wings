<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wings 링크트리</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0faf4;
    --card: #ffffff;
    --text: #1e3a2f;
    --sub: #5a8a70;
    --accent1: #3ecf7a;
    --accent2: #26b5c0;
    --accent3: #ff8c69;
    --border: #d6f0e2;
    --shadow: rgba(62, 207, 122, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(62,207,122,0.13) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(38,181,192,0.10) 0%, transparent 55%);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 0 70px;
  }

  .page {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    width: 100%;
    padding: 48px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeDown 0.5s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 0 4px white, 0 0 0 6px var(--accent1);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2.5px dashed rgba(62,207,122,0.4);
    animation: spin 12s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .name {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .bio {
    font-size: 12.5px;
    color: var(--sub);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }

  .email-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--sub);
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .divider {
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent1), transparent);
    margin: 24px 0 20px;
    opacity: 0.5;
  }

  .section-label {
    align-self: flex-start;
    padding: 0 20px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent1);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
    margin-top: 6px;
  }

  .links {
    width: 100%;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 16px;
    background: var(--card);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    box-shadow: 0 3px 14px var(--shadow);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.22s cubic-bezier(.4,0,.2,1);
    animation: fadeUp 0.4s ease both;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-accent, var(--accent1));
    border-radius: 0 2px 2px 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 8px 24px rgba(62,207,122,0.18);
    border-color: var(--accent1);
  }

  .card:hover::before { opacity: 1; }

  .card:nth-child(1) { animation-delay: 0.06s; }
  .card:nth-child(2) { animation-delay: 0.11s; }
  .card:nth-child(3) { animation-delay: 0.16s; }
  .card:nth-child(4) { animation-delay: 0.21s; }
  .card:nth-child(5) { animation-delay: 0.26s; }
  .card:nth-child(6) { animation-delay: 0.31s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .icon.sb   { background: linear-gradient(135deg, #ffe6d6, #ffc9a8); }
  .icon.tg   { background: linear-gradient(135deg, #d6f6ff, #b8eaff); }
  .icon.tg2  { background: linear-gradient(135deg, #ddfff0, #b8f5da); }
  .icon.tg3  { background: linear-gradient(135deg, #e5f0ff, #c8daff); }
  .icon.dc   { background: linear-gradient(135deg, #e8e5ff, #d0caff); }
  .icon.tw   { background: linear-gradient(135deg, #e8f4ff, #cce8ff); }
  .icon.yt   { background: linear-gradient(135deg, #ffe8e8, #ffcccc); }

  .info { display: flex; flex-direction: column; gap: 2px; flex: 1; }

  .label {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .sublabel {
    font-size: 11px;
    color: var(--sub);
    letter-spacing: 0.01em;
  }

  .arrow {
    color: var(--accent1);
    font-size: 18px;
    font-weight: 300;
    opacity: 0.6;
    transition: opacity 0.2s, transform 0.2s;
  }

  .card:hover .arrow {
    opacity: 1;
    transform: translateX(3px);
  }

  .footer {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .footer-tag {
    font-size: 11px;
    color: #aacfbb;
    letter-spacing: 0.1em;
    font-family: 'Gowun Dodum', sans-serif;
  }

  .dots {
    display: flex;
    gap: 5px;
  }

  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent1);
    opacity: 0.35;
    animation: pulse 2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.3s; background: var(--accent2); }
  .dot:nth-child(3) { animation-delay: 0.6s; background: var(--accent3); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.35; }
    50% { transform: scale(1.4); opacity: 0.7; }
  }
</style>
</head>
